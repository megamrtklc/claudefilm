<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sinemo: film ve dizileri keşfet, fragmanları izle, nerede yayınlandığını gör; günlüğünü, puanlarını ve izleme ilerlemeni tek yerde tut.">
<title>Sinemo – Film ve Dizi Günlüğün</title>
<style>
:root{--bg:#f4f0e8;--sf:#fffdf8;--tx:#1c1a17;--mu:#6d675d;--ac:#c2410c;--gr:#15803d;--bd:#e2dbcd;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c;--sf:#1c2228;--tx:#eee9df;--mu:#9aa3ab;--ac:#ff8a3d;--gr:#4ade80;--bd:#2a323a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181c;--sf:#1c2228;--tx:#eee9df;--mu:#9aa3ab;--ac:#ff8a3d;--gr:#4ade80;--bd:#2a323a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,.logo{font-family:Georgia,"Times New Roman",serif}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.logo{font-size:26px;font-weight:700;color:var(--ac);padding:0 10px 14px}
.nv{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-radius:10px;padding:10px 12px;background:none;color:var(--mu);font:inherit;cursor:pointer}
.nv:hover{background:var(--sf);color:var(--tx)}
.nv.on{background:var(--sf);color:var(--ac);font-weight:600;box-shadow:inset 3px 0 var(--ac)}
.col{min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;padding:14px 24px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:7px 14px}
button{cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.top input{flex:1}
main{padding:22px 24px;min-height:70vh}
.hero{border-radius:16px;min-height:360px;padding:34px 28px;color:#fff;background:#222 center/cover;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:8px;transition:background-image .6s}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000e,#0002)}
.hero>*{position:relative;max-width:540px}.hero h1{margin:4px 0;font-size:clamp(28px,4vw,42px)}
.hero p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dots{display:flex;gap:6px;margin-top:12px}.dot{width:10px;height:10px;padding:0;border:0;border-radius:50%;background:#fff6}.dot.on{background:#fff;width:26px;border-radius:6px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px}.box b{display:block;font-size:28px;font-family:Georgia,serif;color:var(--ac)}
.sec{margin:26px 0 10px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity}.rail .card{flex:0 0 140px;scroll-snap-align:start}
.card{position:relative;padding:0;overflow:hidden;border-radius:8px;border:1px solid var(--bd);transition:transform .2s,box-shadow .2s;text-align:left}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 26px #0006;border-color:var(--ac)}
.card img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--bd)}
.ph{display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;color:var(--mu)}
.ov{position:absolute;inset:auto 0 0;padding:26px 8px 8px;background:linear-gradient(transparent,#000d);color:#fff;font-size:13px;opacity:0;transition:opacity .2s}
.card:hover .ov,.card:focus-visible .ov{opacity:1}
.bd{position:absolute;top:6px;right:6px;background:#000b;color:#fff;font-size:12px;padding:1px 7px;border-radius:999px}
.my{color:var(--gr);font-size:12px;padding:3px 6px;letter-spacing:1px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.bar{height:10px;border-radius:5px;background:var(--ac);margin:3px 0 10px}
.dia{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.dia span:first-child{color:var(--mu);min-width:80px}
.sk{height:360px;border-radius:16px;background:linear-gradient(90deg,var(--sf),var(--bd),var(--sf));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--sf);color:var(--tx);max-width:660px;width:calc(100% - 24px);padding:20px;max-height:92vh}
dialog::backdrop{background:#000a}
.ban{height:190px;margin:-20px -20px 14px;background:center/cover;border-radius:16px 16px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.star{padding:2px 6px;font-size:22px;border:0;background:none;color:var(--mu)}.star.on{color:var(--gr);background:none}
textarea{width:100%;margin-top:10px;border-radius:10px;resize:vertical}
input[type=number]{width:72px}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:12px}
.note{background:var(--sf);border:1px solid var(--ac);border-radius:14px;padding:18px}
.more{display:block;margin:20px auto}
.meta{color:var(--mu);font-size:14px}a{color:var(--ac)}
footer{padding:10px 24px 30px;color:var(--mu);font-size:13px}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{position:fixed;inset:auto 0 0;height:auto;flex-direction:row;padding:6px;z-index:9;background:var(--bg);border:0;border-top:1px solid var(--bd);justify-content:space-around}.logo{display:none}.nv{flex-direction:column;gap:0;font-size:11px;text-align:center;padding:6px;width:auto}.nv.on{box-shadow:none}.two{grid-template-columns:1fr}main{padding:16px 14px 80px}.top{padding:10px 14px}footer{padding-bottom:80px}}
</style>
</head>
<body>
<div class="shell">
<aside id="side"></aside>
<div class="col">
<div class="top"><input id="q" type="search" placeholder="Film veya dizi ara…" aria-label="Ara"><button id="th" aria-label="Tema değiştir">◐</button></div>
<main id="app"></main>
<footer>Bu ürün TMDB API’sini kullanır, ancak TMDB tarafından onaylanmamış veya sertifikalandırılmamıştır. Yayın platformu bilgileri JustWatch tarafından sağlanır.</footer>
</div>
</div>
<dialog id="dlg"></dialog>
<script>
/* KURULUM: themoviedb.org > Ayarlar > API bölümündeki "API Key (v3)" değerini buraya yapıştır. */
var KEY="3108265ab3fdbf3af14175edf64a9c7f";
const API="https://api.themoviedb.org/3",IMG="https://image.tmdb.org/t/p/",REGION="TR",ST=["İzlenecek","İzleniyor","İzlendi"];
const S={view:"home",type:"movie",cat:"trending",genre:"",q:"",page:1,total:1,items:[],genres:{movie:[],tv:[]},rows:null,hero:[],hi:0};
let L={},busy=false,timer;
try{L=JSON.parse(localStorage.getItem("sinemo")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("sinemo",JSON.stringify(L))}catch(e){}};
const $=s=>document.querySelector(s),vals=()=>Object.keys(L).map(k=>L[k]);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stars=n=>"★".repeat(n)+"☆".repeat(5-n),today=()=>new Date().toISOString().slice(0,10);
function api(p,o){const u=new URL(API+p);u.searchParams.set("api_key",KEY);u.searchParams.set("language","tr-TR");for(const k in o||{})u.searchParams.set(k,o[k]);return fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})}
const norm=(r,t)=>({id:r.id,type:r.media_type||t,title:r.title||r.name||"",poster:r.poster_path,back:r.backdrop_path,rating:r.vote_average||0,year:(r.release_date||r.first_air_date||"").slice(0,4),overview:r.overview||""});
function card(it,i,src){const c=L[it.type+it.id],ph=it.poster?`<img loading="lazy" alt="${esc(it.title)} afişi" src="${IMG}w342${it.poster}">`:`<div class="ph">${esc(it.title)}</div>`;
return `<button class="card" data-${src}="${i}">${ph}${it.rating?`<span class="bd">★ ${it.rating.toFixed(1)}</span>`:""}<div class="ov"><b>${esc(it.title)}</b><br>${it.type=="tv"?"Dizi":"Film"}${it.year?" · "+it.year:""}${c?"<br>● "+c.status:""}</div>${c&&c.my?`<div class="my">${stars(c.my)}</div>`:""}</button>`}
function nav(){$("#side").innerHTML='<div class="logo">Sinemo</div>'+[["home","Ana Sayfa","⌂"],["kesfet","Keşfet","◎"],["liste","Listem","≡"],["istatistik","Günlük","▤"]].map(t=>`<button class="nv ${S.view==t[0]?"on":""}" data-v="${t[0]}"><span>${t[2]}</span>${t[1]}</button>`).join("")}
function setup(){$("#app").innerHTML='<div class="note"><h2>Kurulum gerekli</h2><p>Bu site film ve dizi verilerini TMDB’den çeker. <code>index.html</code> dosyasının başındaki <code>KEY</code> değişkenine ücretsiz API anahtarını yapıştır:</p><ol><li><a href="https://www.themoviedb.org/signup">themoviedb.org</a> hesabı aç</li><li>Ayarlar → API bölümünden “API Key (v3)” değerini al</li><li>Dosyayı kaydet ve GitHub’a yükle</li></ol></div>'}
function load(reset){if(busy)return;busy=true;if(reset){S.page=1;S.items=[]}
const t=S.type,o={page:S.page};let p;
if(S.q){p="/search/"+t;o.query=S.q}
else if(S.genre){p="/discover/"+t;o.with_genres=S.genre;o.sort_by=S.cat=="top"?"vote_average.desc":"popularity.desc";if(S.cat=="top")o["vote_count.gte"]=500}
else p=S.cat=="trending"?`/trending/${t}/week`:`/${t}/`+(S.cat=="top"?"top_rated":"popular");
api(p,o).then(d=>{S.total=d.total_pages;S.items=S.items.concat(d.results.map(r=>norm(r,t)));busy=false;draw()}).catch(()=>{busy=false;$("#app").innerHTML='<div class="note">Veriler alınamadı. API anahtarını ve internet bağlantını kontrol et.</div>'})}
function loadHome(){Promise.all([api("/trending/all/week"),api("/trending/movie/week"),api("/trending/tv/week"),api("/movie/top_rated"),api("/tv/popular")]).then(r=>{
const n=(d,t)=>d.results.map(x=>norm(x,t));
S.rows=[["Bu hafta herkes bunu izliyor",n(r[1],"movie")],["Haftanın dizileri",n(r[2],"tv")],["En yüksek puanlı filmler",n(r[3],"movie")],["Popüler diziler",n(r[4],"tv")]];
S.hero=n(r[0]).filter(x=>x.back).slice(0,5);draw()}).catch(()=>{})}
function heroIn(){const h=S.hero[S.hi];return `<small>HAFTANIN ÖNE ÇIKANI · ${h.type=="tv"?"DİZİ":"FİLM"}</small><h1>${esc(h.title)}</h1><p>${esc(h.overview)}</p><div class="row"><button class="on" data-hh="1">▶ Detay &amp; Fragman</button><span>★ ${h.rating.toFixed(1)}${h.year?" · "+h.year:""}</span></div><div class="dots">${S.hero.map((_,i)=>`<button class="dot${i==S.hi?" on":""}" data-hd="${i}" aria-label="Slayt ${i+1}"></button>`).join("")}</div>`}
function setHero(){const e=$("#hero");if(e&&S.hero.length){e.style.backgroundImage=`url(${IMG}w1280${S.hero[S.hi].back})`;e.innerHTML=heroIn()}}
function drawHome(){if(!S.rows){$("#app").innerHTML='<div class="sk"></div>';return}
const a=vals(),w=a.filter(x=>x.status=="İzlendi"),r=w.filter(x=>x.my),avg=r.length?(r.reduce((s,x)=>s+x.my,0)/r.length).toFixed(1):"–";
let h=`<div class="stat"><div class="box"><b>${a.length}</b>Listede</div><div class="box"><b>${a.filter(x=>x.status=="İzleniyor").length}</b>İzleniyor</div><div class="box"><b>${w.length}</b>İzlendi</div><div class="box"><b>${avg}</b>Ortalama puanın</div></div><div class="hero" id="hero"></div>`;
const c=a.filter(x=>x.status=="İzleniyor");
if(c.length)h+=`<h2 class="sec">İzlemeye devam et</h2><div class="rail">${c.map(x=>card(x,x.type+x.id,"l")).join("")}</div>`;
S.rows.forEach((r,ri)=>{h+=`<h2 class="sec">${r[0]}</h2><div class="rail">${r[1].map((x,i)=>card(x,ri+"-"+i,"r")).join("")}</div>`});
$("#app").innerHTML=h;setHero()}
function draw(){nav();
if(S.view=="home")return drawHome();
if(S.view=="kesfet"){const gs=S.genres[S.type];
$("#app").innerHTML=`<div class="tools"><button data-t="movie" class="${S.type=="movie"?"on":""}">Filmler</button><button data-t="tv" class="${S.type=="tv"?"on":""}">Diziler</button><select id="cat" aria-label="Kategori">${[["trending","Haftanın trendleri"],["popular","Popüler"],["top","En yüksek puanlı"]].map(c=>`<option value="${c[0]}"${S.cat==c[0]?" selected":""}>${c[1]}</option>`).join("")}</select><select id="gn" aria-label="Tür"><option value="">Tüm türler</option>${gs.map(g=>`<option value="${g.id}"${S.genre==g.id?" selected":""}>${esc(g.name)}</option>`).join("")}</select>${S.q?`<span class="meta">“${esc(S.q)}” sonuçları</span>`:""}</div><div class="grid">${S.items.map((it,i)=>card(it,i,"i")).join("")||"Sonuç bulunamadı."}</div>${S.page<S.total?'<button class="more" data-more="1">Daha fazla göster</button>':""}`;
}else if(S.view=="liste"){const a=vals();
$("#app").innerHTML=ST.map(s=>{const r=a.filter(x=>x.status==s);return `<h2 class="sec">${s} (${r.length})</h2><div class="grid">${r.map(x=>card(x,x.type+x.id,"l")).join("")||'<span class="meta">Henüz yok.</span>'}</div>`}).join("");
}else{const a=vals(),w=a.filter(x=>x.status=="İzlendi"),yr=String(new Date().getFullYear()),wy=w.filter(x=>(x.date||"").slice(0,4)==yr),r=w.filter(x=>x.my),gc={},dist=[0,0,0,0,0,0];
a.forEach(x=>(x.genres||[]).forEach(g=>gc[g]=(gc[g]||0)+1));r.forEach(x=>dist[x.my]++);
const top=Object.keys(gc).sort((x,y)=>gc[y]-gc[x]).slice(0,6),avg=r.length?(r.reduce((s,x)=>s+x.my,0)/r.length).toFixed(1):"–",di=w.filter(x=>x.date).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,12);
$("#app").innerHTML=`<h2 class="sec" style="margin-top:0">${yr} özetin</h2><div class="stat"><div class="box"><b>${wy.length}</b>Bu yıl izlenen</div><div class="box"><b>${wy.filter(x=>x.type=="movie").length}</b>Film</div><div class="box"><b>${wy.filter(x=>x.type=="tv").length}</b>Dizi</div><div class="box"><b>${avg}</b>Ortalama puanın</div></div>
<div class="two"><div><h2 class="sec">Puan dağılımın</h2>${[5,4,3,2,1].map(n=>`<span class="my">${stars(n)}</span> ${dist[n]}<div class="bar" style="width:${Math.min(100,dist[n]*18)}%"></div>`).join("")}<h2 class="sec">En çok listelediğin türler</h2>${top.map(g=>`${esc(g)} (${gc[g]})<div class="bar" style="width:${Math.min(100,gc[g]*18)}%"></div>`).join("")||'<span class="meta">Listene yapım ekledikçe burada görünür.</span>'}</div>
<div><h2 class="sec">Günlük</h2>${di.map(x=>`<div class="dia"><span>${x.date}</span><span><b>${esc(x.title)}</b> <span class="my">${x.my?stars(x.my):""}</span>${x.note?`<br><span class="meta">${esc(x.note)}</span>`:""}</span></div>`).join("")||'<span class="meta">“İzlendi” işaretlediğin yapımlar tarihiyle burada görünür.</span>'}</div></div>`}}
function ent(){const d=$("#dlg"),it=d._it,k=it.type+it.id;return L[k]||(L[k]={id:it.id,type:it.type,title:it.title,poster:it.poster,back:it.back,rating:it.rating,year:it.year,overview:it.overview,genres:d._gn||[],status:"İzlenecek",s:1,e:0})}
function ctl(){const it=$("#dlg")._it,c=L[it.type+it.id]||{};
$("#ctl").innerHTML=`<div class="row">${ST.map(s=>`<button class="${c.status==s?"on":""}" data-s="${s}">${s}</button>`).join("")}</div><div class="row">Puanın: ${[1,2,3,4,5].map(n=>`<button class="star${(c.my||0)>=n?" on":""}" data-star="${n}" aria-label="${n} yıldız">★</button>`).join("")}</div>${it.type=="tv"&&c.status?`<div class="row">Sezon <input id="se" type="number" min="1" value="${c.s||1}"> Bölüm <input id="ep" type="number" min="0" value="${c.e||0}"></div>`:""}${c.status?`<textarea id="nt" rows="2" placeholder="Kısa not veya yorum…">${esc(c.note||"")}</textarea>`:""}<div class="row">${c.status?'<button data-s="">Listeden çıkar</button>':""}<button data-x="1">Kapat</button></div>`}
function openIt(it){const d=$("#dlg");d._it=it;d._gn=null;d.innerHTML="Yükleniyor…";d.showModal();
api(`/${it.type}/${it.id}`,{append_to_response:"videos,watch/providers,credits",include_video_language:"tr,en,null"}).then(x=>{
const gn=(x.genres||[]).map(g=>g.name),v=((x.videos||{}).results||[]).filter(y=>y.site=="YouTube").sort((a,b)=>(b.type=="Trailer")-(a.type=="Trailer"))[0],
pr=((x["watch/providers"]||{}).results||{})[REGION],fl=pr&&(pr.flatrate||[]).map(p=>p.provider_name),cs=((x.credits||{}).cast||[]).slice(0,8).map(c=>esc(c.name));
d._gn=gn;const c=L[it.type+it.id];if(c&&!c.genres.length){c.genres=gn;save()}
d.innerHTML=`${x.backdrop_path?`<div class="ban" style="background-image:url(${IMG}w780${x.backdrop_path})"></div>`:""}<h2 style="margin:0">${esc(it.title)}</h2><p class="meta" style="margin:4px 0">${it.type=="tv"?"Dizi":"Film"}${it.year?" · "+it.year:""} · ★ ${it.rating.toFixed(1)} · ${esc(gn.join(", "))}${x.runtime?" · "+x.runtime+" dk":""}${x.number_of_seasons?" · "+x.number_of_seasons+" sezon":""}</p><p>${esc(it.overview||"Türkçe özet bulunamadı.")}</p>${cs.length?`<p><b>Oyuncular:</b> ${cs.join(", ")}</p>`:""}<p><b>Nerede izlenir (TR):</b> ${fl&&fl.length?esc(fl.join(", ")):"Abonelikli platform bilgisi yok"}${pr&&pr.link?` · <a target="_blank" rel="noopener" href="${esc(pr.link)}">tüm seçenekler</a>`:""}</p>${v?`<iframe loading="lazy" allowfullscreen title="Fragman" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.key)}"></iframe>`:""}<div id="ctl"></div>`;ctl()
}).catch(()=>{d.innerHTML='Detaylar alınamadı. <button data-x="1">Kapat</button>'})}
function go(v){S.view=v;if(location.hash.slice(1)!=v)location.hash=v;if(v=="kesfet"&&!S.items.length)load(true);else draw();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const D=t.dataset;
if(D.v)go(D.v);
else if(D.hd!==undefined){S.hi=+D.hd;setHero()}
else if(D.hh)openIt(S.hero[S.hi]);
else if(D.r!==undefined){const q=D.r.split("-");openIt(S.rows[q[0]][1][q[1]])}
else if(D.t){S.type=D.t;S.genre="";load(true)}
else if(D.more){S.page++;load()}
else if(D.i!==undefined)openIt(S.items[+D.i]);
else if(D.l!==undefined)openIt(L[D.l]);
else if(D.x)$("#dlg").close();
else if(D.star){const c=ent(),n=+D.star;c.my=c.my==n?0:n;if(c.status=="İzlenecek"){c.status="İzlendi"}if(c.status=="İzlendi"&&!c.date)c.date=today();save();ctl();draw()}
else if(D.s!==undefined){const d=$("#dlg"),it=d._it;if(D.s){const c=ent();c.status=D.s;if(D.s=="İzlendi"&&!c.date)c.date=today()}else delete L[it.type+it.id];save();ctl();draw()}
else if(t.id=="th"){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dk?"light":"dark"}});
document.addEventListener("change",e=>{const i=e.target;
if(i.id=="cat"){S.cat=i.value;load(true)}
else if(i.id=="gn"){S.genre=i.value;load(true)}
else if(i.id=="se"||i.id=="ep"){const c=ent();c.s=+$("#se").value||1;c.e=+$("#ep").value||0;save()}
else if(i.id=="nt"){ent().note=i.value;save();draw()}});
$("#q").addEventListener("input",e=>{clearTimeout(timer);const v=e.target.value.trim();timer=setTimeout(()=>{if(!KEY)return;S.q=v;S.genre="";S.view="kesfet";location.hash="kesfet";busy=false;load(true)},450)});
addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(["home","kesfet","liste","istatistik"].includes(v)&&v!=S.view)go(v)});
setInterval(()=>{if(S.view=="home"&&S.hero.length&&!$("#dlg").open){S.hi=(S.hi+1)%S.hero.length;setHero()}},7000);
(function init(){const v=location.hash.slice(1);if(["home","kesfet","liste","istatistik"].includes(v))S.view=v;nav();
if(!KEY){setup();return}
Promise.all([api("/genre/movie/list"),api("/genre/tv/list")]).then(r=>{S.genres.movie=r[0].genres;S.genres.tv=r[1].genres}).catch(()=>{}).then(()=>{loadHome();if(S.view=="kesfet")load(true);else draw()})})();
